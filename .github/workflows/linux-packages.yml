name: OpenAI Reasoning Guard Packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target to build"
        required: false
        default: "linux-x86_64"
        type: choice
        options:
          - "linux-x86_64"
          - "linux-x86_32"
          - "linux-arm64"
          - "linux-arm32"
          - "windows-x86_64"
          - "windows-x86_32"
          - "windows-arm64"
          - "macos-x86_64"
          - "macos-aarch64"
          - "all"
      clean:
        description: "Clean package work/dist directories before building"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      publish_release:
        description: "Upload built packages to a GitHub Release"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      release_tag:
        description: "Release tag used when publish_release=true"
        required: false
        default: "nightly"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select package targets
    runs-on: ubuntu-22.04
    outputs:
      linux_enabled: ${{ steps.matrix.outputs.linux_enabled }}
      linux_matrix: ${{ steps.matrix.outputs.linux_matrix }}
      windows_enabled: ${{ steps.matrix.outputs.windows_enabled }}
      windows_matrix: ${{ steps.matrix.outputs.windows_matrix }}
      windows_smoke_enabled: ${{ steps.matrix.outputs.windows_smoke_enabled }}
      windows_smoke_matrix: ${{ steps.matrix.outputs.windows_smoke_matrix }}
      macos_enabled: ${{ steps.matrix.outputs.macos_enabled }}
      macos_matrix: ${{ steps.matrix.outputs.macos_matrix }}
    steps:
      - id: matrix
        shell: bash
        env:
          REQUESTED_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release == 'true' }}
        run: |
          set -euo pipefail

          if [[ "${PUBLISH_RELEASE}" == "true" && "${REQUESTED_TARGET}" != "all" ]]; then
            echo "Release publication requires target=all" >&2
            exit 2
          fi

          linux_x86_64='{"arch":"x86_64","platform":"linux/amd64","image":"debian:bookworm","qt_secret":"QT_LINUX_X86_64_URL","sdk_release_tag":"qt-sdk-linux-x86_64","sdk_asset":"qt5-linux-x86_64.tar.xz","appimage_arch":"x86_64","appimage_runtime_asset":"runtime-x86_64"}'
          linux_x86_32='{"arch":"x86_32","platform":"linux/386","image":"i386/debian:bookworm","qt_secret":"QT_LINUX_X86_32_URL","sdk_release_tag":"qt-sdk-linux-x86_32","sdk_asset":"qt5-linux-x86_32.tar.xz","appimage_arch":"i686","appimage_runtime_asset":"runtime-i686"}'
          linux_arm64='{"arch":"arm64","platform":"linux/arm64","image":"arm64v8/debian:bookworm","qt_secret":"QT_LINUX_ARM64_URL","sdk_release_tag":"qt-sdk-linux-arm64","sdk_asset":"qt5-linux-arm64.tar.xz","appimage_arch":"aarch64","appimage_runtime_asset":"runtime-aarch64"}'
          linux_arm32='{"arch":"arm32","platform":"linux/arm/v7","image":"arm32v7/debian:bookworm","qt_secret":"QT_LINUX_ARM32_URL","sdk_release_tag":"qt-sdk-linux-arm32","sdk_asset":"qt5-linux-arm32.tar.xz","appimage_arch":"armhf","appimage_runtime_asset":"runtime-armhf"}'
          windows_x86_64='{"arch":"x86_64","mingw_triple":"x86_64-w64-mingw32","apt_package":"g++-mingw-w64-x86-64-posix","qt_secret":"QT_WINDOWS_X86_64_URL","sdk_release_tag":"qt-sdk-windows-x86_64","sdk_asset":"qt5-windows-x86_64.tar.xz"}'
          windows_x86_32='{"arch":"x86_32","mingw_triple":"i686-w64-mingw32","apt_package":"g++-mingw-w64-i686-posix","qt_secret":"QT_WINDOWS_X86_32_URL","sdk_release_tag":"qt-sdk-windows-x86_32","sdk_asset":"qt5-windows-x86_32.tar.xz"}'
          windows_arm64='{"arch":"arm64","mingw_triple":"aarch64-w64-mingw32","apt_package":"","llvm_mingw_url":"https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz","qt_secret":"QT_WINDOWS_ARM64_URL","sdk_release_tag":"qt-sdk-windows-arm64","sdk_asset":"qt5-windows-arm64.tar.xz"}'
          macos_x86_64='{"arch":"x86_64","runner":"macos-15-intel","cmake_arch":"x86_64","deployment_target":"10.13","qt_secret":"QT_MACOS_X86_64_URL","sdk_release_tag":"qt-sdk-macos-x86_64","sdk_asset":"qt5-macos-x86_64.tar.xz"}'
          macos_aarch64='{"arch":"aarch64","runner":"macos-14","cmake_arch":"arm64","deployment_target":"11.0","qt_secret":"QT_MACOS_ARM64_URL","sdk_release_tag":"qt-sdk-macos-aarch64","sdk_asset":"qt5-macos-aarch64.tar.xz"}'

          linux='[]'
          windows='[]'
          windows_smoke='[]'
          macos='[]'
          case "${REQUESTED_TARGET}" in
            all)
              linux="[${linux_x86_64},${linux_x86_32},${linux_arm64},${linux_arm32}]"
              windows="[${windows_x86_64},${windows_x86_32},${windows_arm64}]"
              windows_smoke='[{"arch":"x86_64"},{"arch":"x86_32"}]'
              macos="[${macos_x86_64},${macos_aarch64}]"
              ;;
            linux-x86_64) linux="[${linux_x86_64}]" ;;
            linux-x86_32) linux="[${linux_x86_32}]" ;;
            linux-arm64) linux="[${linux_arm64}]" ;;
            linux-arm32) linux="[${linux_arm32}]" ;;
            windows-x86_64)
              windows="[${windows_x86_64}]"
              windows_smoke='[{"arch":"x86_64"}]'
              ;;
            windows-x86_32)
              windows="[${windows_x86_32}]"
              windows_smoke='[{"arch":"x86_32"}]'
              ;;
            windows-arm64) windows="[${windows_arm64}]" ;;
            macos-x86_64) macos="[${macos_x86_64}]" ;;
            macos-aarch64) macos="[${macos_aarch64}]" ;;
            *)
              echo "unsupported target: ${REQUESTED_TARGET}" >&2
              exit 2
              ;;
          esac

          enabled() {
            [[ "$1" != "[]" ]] && printf true || printf false
          }

          {
            echo "linux_enabled=$(enabled "${linux}")"
            echo "linux_matrix={\"include\":${linux}}"
            echo "windows_enabled=$(enabled "${windows}")"
            echo "windows_matrix={\"include\":${windows}}"
            echo "windows_smoke_enabled=$(enabled "${windows_smoke}")"
            echo "windows_smoke_matrix={\"include\":${windows_smoke}}"
            echo "macos_enabled=$(enabled "${macos}")"
            echo "macos_matrix={\"include\":${macos}}"
          } >> "${GITHUB_OUTPUT}"

  linux:
    name: Linux ${{ matrix.arch }} deb/rpm/AppImage
    needs: plan
    if: needs.plan.outputs.linux_enabled == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux_matrix) }}
    env:
      QT_ARCHIVE_URL: ${{ secrets[matrix.qt_secret] }}
      QT_ARCHIVE_FALLBACK_URL: https://github.com/${{ github.repository }}/releases/download/${{ matrix.sdk_release_tag }}/${{ matrix.sdk_asset }}
      DOWNLOAD_PROXY: ${{ secrets.DOWNLOAD_PROXY }}
      CLEAN_PACKAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.clean != 'false' }}
      BUILD_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
    steps:
      - name: Checkout
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('linux-{0}', matrix.arch)
        uses: actions/checkout@v4

      - name: Enable QEMU
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('linux-{0}', matrix.arch)
        uses: docker/setup-qemu-action@v3

      - name: Build Linux packages
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('linux-{0}', matrix.arch)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${QT_ARCHIVE_URL:-}" && -z "${QT_ARCHIVE_FALLBACK_URL:-}" ]]; then
            echo "Missing repository secret ${{ matrix.qt_secret }} and no fallback Qt SDK URL is configured" >&2
            exit 2
          fi

          docker_env=()
          if [[ "${{ matrix.arch }}" == arm64 || "${{ matrix.arch }}" == arm32 ]]; then
            docker_env+=(-e APPIMAGE_STAGE_ONLY=1)
          fi

          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e QT_ARCHIVE_URL="${QT_ARCHIVE_URL:-}" \
            -e QT_ARCHIVE_FALLBACK_URL="${QT_ARCHIVE_FALLBACK_URL:-}" \
            -e DOWNLOAD_PROXY="${DOWNLOAD_PROXY:-}" \
            -e PACKAGE_ARCH="${{ matrix.arch }}" \
            -e CLEAN_PACKAGES="${CLEAN_PACKAGES}" \
            "${docker_env[@]}" \
            ${{ matrix.image }} \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                bash \
                build-essential \
                ca-certificates \
                cmake \
                curl \
                dpkg-dev \
                fakeroot \
                file \
                libfontconfig1-dev \
                libfreetype6-dev \
                libglib2.0-dev \
                libice-dev \
                libsm-dev \
                libx11-dev \
                libx11-xcb-dev \
                libxau-dev \
                libxi-dev \
                libxcb1-dev \
                libxcb-glx0-dev \
                libxcb-icccm4-dev \
                libxcb-image0-dev \
                libxcb-keysyms1-dev \
                libxcb-randr0-dev \
                libxcb-render0-dev \
                libxcb-render-util0-dev \
                libxcb-shape0-dev \
                libxcb-shm0-dev \
                libxcb-sync-dev \
                libxcb-util-dev \
                libxcb-xfixes0-dev \
                libxcb-xinerama0-dev \
                libxcb-xkb-dev \
                libxdmcp-dev \
                libxext-dev \
                libxkbcommon-dev \
                libxkbcommon-x11-dev \
                uuid-dev \
                patchelf \
                rpm \
                unzip \
                xz-utils \
                zlib1g

              qt_dir=/opt/qt-sdk
              archive=/tmp/qt-sdk.archive
              mkdir -p "${qt_dir}"
              qt_urls=()
              if [[ -n "${QT_ARCHIVE_URL:-}" ]]; then
                qt_urls+=("${QT_ARCHIVE_URL}")
              fi
              if [[ -n "${QT_ARCHIVE_FALLBACK_URL:-}" && "${QT_ARCHIVE_FALLBACK_URL:-}" != "${QT_ARCHIVE_URL:-}" ]]; then
                qt_urls+=("${QT_ARCHIVE_FALLBACK_URL}")
              fi
              downloaded=0
              for qt_url in "${qt_urls[@]}"; do
                curl_args=(-L --fail --connect-timeout 30 -o "${archive}")
                if [[ -n "${DOWNLOAD_PROXY:-}" ]]; then
                  curl_args+=(--proxy "${DOWNLOAD_PROXY}")
                fi
                if curl "${curl_args[@]}" "${qt_url}"; then
                  downloaded=1
                  break
                fi
                echo "warning: failed to download Qt SDK from ${qt_url}; trying next candidate" >&2
              done
              if ((downloaded == 0)); then
                echo "Unable to download Qt SDK archive" >&2
                exit 2
              fi

              if tar -tf "${archive}" >/dev/null 2>&1; then
                tar -xf "${archive}" -C "${qt_dir}"
              elif unzip -tq "${archive}" >/dev/null 2>&1; then
                unzip -q "${archive}" -d "${qt_dir}"
              else
                echo "Qt archive must be a tar/tar.gz/tar.xz/tgz or zip file" >&2
                exit 2
              fi

              moc_path="$(find "${qt_dir}" -type f -path "*/bin/moc" -print -quit)"
              if [[ -z "${moc_path}" ]]; then
                echo "Unable to locate bin/moc inside downloaded Qt archive" >&2
                exit 2
              fi
              chmod +x "${moc_path}" || true
              qt_root="$(cd -- "$(dirname -- "${moc_path}")/.." && pwd)"
              test -f "${qt_root}/lib/libQt5Core.so.5"
              test -f "${qt_root}/lib/libQt5Sql.so.5"
              test -f "${qt_root}/plugins/sqldrivers/libqsqlite.so"
              test -f "${qt_root}/lib/cmake/Qt5Sql/Qt5SqlConfig.cmake"
              echo "Using Qt root: ${qt_root}"

              build_dir="/workspace/build-ci-${PACKAGE_ARCH}"
              cmake -S /workspace -B "${build_dir}" \
                -DCMAKE_BUILD_TYPE=Release \
                -DNET_TUNNEL_QT_SDK_ROOT="${qt_root}" \
                -DNET_TUNNEL_BUILD_TESTS=ON
              cmake --build "${build_dir}" -j"$(nproc)"
              ctest --test-dir "${build_dir}" --output-on-failure

              package_args=(--all --skip-build)
              if [[ "${CLEAN_PACKAGES:-true}" == "true" ]]; then
                package_args+=(--clean)
              fi
              QT_ROOT="${qt_root}" \
              BUILD_DIR="${build_dir}" \
              DIST_DIR="/workspace/dist/${PACKAGE_ARCH}" \
              WORK_DIR="/workspace/.package-work/${PACKAGE_ARCH}" \
              scripts/package-linux.sh "${package_args[@]}"

              for package_root in \
                "/workspace/.package-work/${PACKAGE_ARCH}/debroot" \
                "/workspace/.package-work/${PACKAGE_ARCH}/rpmroot" \
                "/workspace/.package-work/${PACKAGE_ARCH}/AppDir-gui" \
                "/workspace/.package-work/${PACKAGE_ARCH}/AppDir-cli"; do
                  test -f "${package_root}/opt/openai-reasoning-guard/qt/lib/libQt5Sql.so.5"
                  test -f "${package_root}/opt/openai-reasoning-guard/qt/plugins/sqldrivers/libqsqlite.so"
                  smoke_dir="$(mktemp -d)"
                  "${package_root}/opt/openai-reasoning-guard/bin/openai-reasoning-guard-cli" \
                    profile list --json --config "${smoke_dir}/config.json" >/dev/null
                  test -f "${smoke_dir}/upstream-profiles.sqlite3"
                  rm -rf "${smoke_dir}"
              done

              deb_path="$(find "/workspace/dist/${PACKAGE_ARCH}" -maxdepth 1 -type f -name "*.deb" -print -quit)"
              rpm_path="$(find "/workspace/dist/${PACKAGE_ARCH}" -maxdepth 1 -type f -name "*.rpm" -print -quit)"
              test -n "${deb_path}"
              test -n "${rpm_path}"
              dpkg-deb --contents "${deb_path}" | grep -F "/opt/openai-reasoning-guard/qt/lib/libQt5Sql.so.5" >/dev/null
              dpkg-deb --contents "${deb_path}" | grep -F "/opt/openai-reasoning-guard/qt/plugins/sqldrivers/libqsqlite.so" >/dev/null
              rpm -qpl "${rpm_path}" | grep -Fx "/opt/openai-reasoning-guard/qt/lib/libQt5Sql.so.5" >/dev/null
              rpm -qpl "${rpm_path}" | grep -Fx "/opt/openai-reasoning-guard/qt/plugins/sqldrivers/libqsqlite.so" >/dev/null
            '
          sudo chown -R "$(id -u):$(id -g)" \
            "build-ci-${{ matrix.arch }}" \
            "dist/${{ matrix.arch }}" \
            ".package-work/${{ matrix.arch }}" || true

      - name: Build ARM AppImages on runner
        if: (env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('linux-{0}', matrix.arch)) && (matrix.arch == 'arm64' || matrix.arch == 'arm32')
        shell: bash
        run: |
          set -euo pipefail
          package_id="openai-reasoning-guard"
          version="$(sed -n 's/^project([^ ]* VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          version="${version:-0.1.0}"
          dist_dir="${PWD}/dist/${{ matrix.arch }}"
          work_dir="${PWD}/.package-work/${{ matrix.arch }}"
          tool="${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          runtime="${RUNNER_TEMP}/${{ matrix.appimage_runtime_asset }}"
          curl_args=(-L --fail --connect-timeout 30)
          if [[ -n "${DOWNLOAD_PROXY:-}" ]]; then
            curl_args+=(--proxy "${DOWNLOAD_PROXY}")
          fi
          curl "${curl_args[@]}" -o "${tool}" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          curl "${curl_args[@]}" -o "${runtime}" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/${{ matrix.appimage_runtime_asset }}"
          chmod +x "${tool}" "${runtime}"

          build_appimage() {
            local variant="$1"
            local appdir="${work_dir}/AppDir-${variant}"
            local out="${dist_dir}/${package_id}-${variant}-${version}-${{ matrix.appimage_arch }}.AppImage"
            test -d "${appdir}"
            rm -f "${out}"
            ARCH="${{ matrix.appimage_arch }}" APPIMAGE_EXTRACT_AND_RUN=1 "${tool}" \
              --runtime-file "${runtime}" \
              "${appdir}" \
              "${out}"
            chmod +x "${out}"
            file "${out}"
          }

          build_appimage gui
          build_appimage cli

      - name: Smoke-test final Linux packages
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('linux-{0}', matrix.arch)
        shell: bash
        env:
          TEST_DOCKER_IMAGE: ${{ matrix.image }}
          TEST_DOCKER_PLATFORM: ${{ matrix.platform }}
          TEST_DOCKER_PROXY: ${{ env.DOWNLOAD_PROXY }}
        run: |
          set -euo pipefail
          scripts/test-linux-packages-docker.sh \
            --arch "${{ matrix.arch }}" \
            --input-dir "${PWD}/dist/${{ matrix.arch }}"

      - name: Upload Linux packages
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('linux-{0}', matrix.arch)
        uses: actions/upload-artifact@v4
        with:
          name: openai-reasoning-guard-linux-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/*.deb
            dist/${{ matrix.arch }}/*.rpm
            dist/${{ matrix.arch }}/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} MinGW exe
    needs: plan
    if: needs.plan.outputs.windows_enabled == 'true'
    # NSIS 3.09 fixes an upstream 3.08 uninstaller PE relocation bug that
    # Windows Server rejects with ERROR_BAD_EXE_FORMAT. The package is still
    # cross-built and the installer is still generated entirely on Linux.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.windows_matrix) }}
    env:
      QT_ARCHIVE_URL: ${{ secrets[matrix.qt_secret] }}
      QT_ARCHIVE_FALLBACK_URL: https://github.com/${{ github.repository }}/releases/download/${{ matrix.sdk_release_tag }}/${{ matrix.sdk_asset }}
      DOWNLOAD_PROXY: ${{ secrets.DOWNLOAD_PROXY }}
      CLEAN_PACKAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.clean != 'false' }}
      BUILD_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
    steps:
      - name: Checkout
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('windows-{0}', matrix.arch)
        uses: actions/checkout@v4

      - name: Install MinGW build dependencies
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('windows-{0}', matrix.arch)
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          nsis_package_version="3.09-4ubuntu1"
          apt_packages=(
            build-essential
            ca-certificates
            cmake
            curl
            file
            "nsis=${nsis_package_version}"
            "nsis-common=${nsis_package_version}"
            unzip
            xz-utils
            zip
          )
          if [[ -n "${{ matrix.apt_package }}" ]]; then
            apt_packages+=("${{ matrix.apt_package }}")
          fi
          sudo apt-get install -y --no-install-recommends "${apt_packages[@]}"
          makensis -VERSION

      - name: Install llvm-mingw for Windows ARM64
        if: (env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('windows-{0}', matrix.arch)) && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/llvm-mingw.tar.xz"
          root="${RUNNER_TEMP}/llvm-mingw"
          mkdir -p "${root}"
          curl_args=(-L --fail --connect-timeout 30 -o "${archive}")
          if [[ -n "${DOWNLOAD_PROXY:-}" ]]; then
            curl_args+=(--proxy "${DOWNLOAD_PROXY}")
          fi
          curl "${curl_args[@]}" "${{ matrix.llvm_mingw_url }}"
          tar -xf "${archive}" -C "${root}" --strip-components=1
          test -x "${root}/bin/${{ matrix.mingw_triple }}-gcc"
          echo "MINGW_BIN_DIR=${root}/bin" >> "${GITHUB_ENV}"
          echo "MINGW_SYSROOT=${root}/${{ matrix.mingw_triple }}" >> "${GITHUB_ENV}"

      - name: Resolve Qt SDK
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('windows-{0}', matrix.arch)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${QT_ARCHIVE_URL:-}" && -z "${QT_ARCHIVE_FALLBACK_URL:-}" ]]; then
            echo "Missing repository secret ${{ matrix.qt_secret }} and no fallback Qt SDK URL is configured" >&2
            exit 2
          fi
          qt_dir="${RUNNER_TEMP}/qt-sdk"
          archive="${RUNNER_TEMP}/qt-sdk.archive"
          mkdir -p "${qt_dir}"
          qt_urls=()
          if [[ -n "${QT_ARCHIVE_URL:-}" ]]; then
            qt_urls+=("${QT_ARCHIVE_URL}")
          fi
          if [[ -n "${QT_ARCHIVE_FALLBACK_URL:-}" && "${QT_ARCHIVE_FALLBACK_URL:-}" != "${QT_ARCHIVE_URL:-}" ]]; then
            qt_urls+=("${QT_ARCHIVE_FALLBACK_URL}")
          fi
          downloaded=0
          for qt_url in "${qt_urls[@]}"; do
            curl_args=(-L --fail --connect-timeout 30 -o "${archive}")
            if [[ -n "${DOWNLOAD_PROXY:-}" ]]; then
              curl_args+=(--proxy "${DOWNLOAD_PROXY}")
            fi
            if curl "${curl_args[@]}" "${qt_url}"; then
              downloaded=1
              break
            fi
            echo "warning: failed to download Qt SDK from ${qt_url}; trying next candidate" >&2
          done
          if ((downloaded == 0)); then
            echo "Unable to download Qt SDK archive" >&2
            exit 2
          fi
          if tar -tf "${archive}" >/dev/null 2>&1; then
            tar -xf "${archive}" -C "${qt_dir}"
          elif unzip -tq "${archive}" >/dev/null 2>&1; then
            unzip -q "${archive}" -d "${qt_dir}"
          else
            echo "Qt archive must be a tar/tar.gz/tar.xz/tgz or zip file" >&2
            exit 2
          fi
          moc_path="$(find "${qt_dir}" -type f -path "*/bin/moc" -print -quit)"
          if [[ -z "${moc_path}" ]]; then
            echo "Unable to locate Linux host bin/moc inside downloaded Windows MinGW Qt archive" >&2
            exit 2
          fi
          chmod +x "${moc_path}" || true
          qt_root="$(cd -- "$(dirname -- "${moc_path}")/.." && pwd)"
          test -f "${qt_root}/bin/Qt5Core.dll"
          test -f "${qt_root}/bin/Qt5Sql.dll"
          test -f "${qt_root}/plugins/sqldrivers/qsqlite.dll"
          test -f "${qt_root}/lib/cmake/Qt5/Qt5Config.cmake"
          test -f "${qt_root}/lib/cmake/Qt5Sql/Qt5SqlConfig.cmake"
          echo "QT_ROOT=${qt_root}" >> "${GITHUB_ENV}"
          echo "Using Qt root: ${qt_root}"

      - name: Build Windows package
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('windows-{0}', matrix.arch)
        shell: bash
        run: |
          set -euo pipefail
          clean_arg=()
          if [[ "${CLEAN_PACKAGES}" == "true" ]]; then
            clean_arg+=(--clean)
          fi
          QT_ROOT="${QT_ROOT}" \
          MINGW_TRIPLE="${{ matrix.mingw_triple }}" \
          PACKAGE_ARCH="${{ matrix.arch }}" \
          BUILD_DIR="${PWD}/build-ci-windows-${{ matrix.arch }}" \
          DIST_DIR="${PWD}/dist/windows-${{ matrix.arch }}" \
          scripts/package-windows-mingw.sh "${clean_arg[@]}"

      - name: Validate Windows package contents
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('windows-{0}', matrix.arch)
        shell: bash
        run: |
          set -euo pipefail
          stage_dir="${PWD}/.package-work/windows-mingw-${{ matrix.arch }}/openai-reasoning-guard-windows-${{ matrix.arch }}"
          work_dir="${PWD}/.package-work/windows-mingw-${{ matrix.arch }}"
          test -f "${stage_dir}/Qt5Sql.dll"
          test -f "${stage_dir}/plugins/sqldrivers/qsqlite.dll"
          portable="$(find "${PWD}/dist/windows-${{ matrix.arch }}" -maxdepth 1 -type f -name '*-portable.zip' -print -quit)"
          test -n "${portable}"
          unzip -Z1 "${portable}" | grep -Fx 'Qt5Sql.dll' >/dev/null
          unzip -Z1 "${portable}" | grep -Fx 'plugins/sqldrivers/qsqlite.dll' >/dev/null
          installer="$(find "${PWD}/dist/windows-${{ matrix.arch }}" -maxdepth 1 -type f -name '*-installer.exe' -print -quit)"
          test -n "${installer}"
          # NSIS uses a PE overlay, which general archive readers do not reliably expose.
          test -s "${installer}"
          test "$(od -An -tx1 -N2 "${installer}" | tr -d '[:space:]')" = '4d5a'
          payload_manifest="${work_dir}/openai-reasoning-guard-${{ matrix.arch }}-installer-payload.txt"
          validation_manifest="${work_dir}/openai-reasoning-guard-${{ matrix.arch }}-installer-validation.sha256"
          nsis_script="${work_dir}/openai-reasoning-guard-${{ matrix.arch }}.nsi"
          test -s "${payload_manifest}"
          test -s "${validation_manifest}"
          test -s "${nsis_script}"
          grep -Fx 'Qt5Sql.dll' "${payload_manifest}" >/dev/null
          grep -Fx 'plugins/sqldrivers/qsqlite.dll' "${payload_manifest}" >/dev/null
          grep -F "File /r \"${stage_dir}/*\"" "${nsis_script}" >/dev/null
          grep -F "  ${installer}" "${validation_manifest}" >/dev/null
          sha256sum --check "${validation_manifest}"

      - name: Upload Windows package
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('windows-{0}', matrix.arch)
        uses: actions/upload-artifact@v4
        with:
          name: openai-reasoning-guard-windows-${{ matrix.arch }}
          path: |
            dist/windows-${{ matrix.arch }}/*windows-${{ matrix.arch }}*.zip
            dist/windows-${{ matrix.arch }}/*windows-${{ matrix.arch }}*.exe
          if-no-files-found: error

  windows-smoke:
    name: Windows ${{ matrix.arch }} package smoke
    needs: [plan, windows]
    if: needs.plan.outputs.windows_smoke_enabled == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.windows_smoke_matrix) }}
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: openai-reasoning-guard-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows-package

      - name: Run installer and CLI profile/QSQLITE smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-ProfileSmoke {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Cli,
                  [Parameter(Mandatory = $true)]
                  [string]$Name
              )

              $smokeDir = Join-Path $env:RUNNER_TEMP "profile-smoke-$Name"
              Remove-Item -Recurse -Force $smokeDir -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
              $configPath = Join-Path $smokeDir "config.json"

              $addJson = (& $Cli --config $configPath profile add `
                  --name "CI smoke" --base-url "https://example.com/v1" --json | Out-String)
              if ($LASTEXITCODE -ne 0) {
                  throw "$Name profile add failed with exit code $LASTEXITCODE"
              }
              $null = $addJson | ConvertFrom-Json

              $listJson = (& $Cli --config $configPath profile list --json | Out-String)
              if ($LASTEXITCODE -ne 0) {
                  throw "$Name profile list failed with exit code $LASTEXITCODE"
              }
              $list = $listJson | ConvertFrom-Json
              if ($list.total_items -ne 1 -or $list.items[0].display_name -ne "CI smoke") {
                  throw "$Name profile list returned unexpected data: $listJson"
              }

              $database = Join-Path $smokeDir "upstream-profiles.sqlite3"
              if (-not (Test-Path $database -PathType Leaf) -or (Get-Item $database).Length -eq 0) {
                  throw "$Name QSQLITE did not create a non-empty profile database: $database"
              }
          }

          function Assert-NsisUninstallerPe {
              param(
                  [Parameter(Mandatory = $true)]
                  [string]$Path
              )

              [byte[]]$bytes = [System.IO.File]::ReadAllBytes($Path)
              if ($bytes.Length -lt 0x40 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
                  throw "NSIS uninstaller is missing its MZ header: $Path"
              }

              $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
              if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
                  throw "NSIS uninstaller has an invalid PE header offset: $Path"
              }
              if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
                  $bytes[$peOffset + 2] -ne 0x00 -or $bytes[$peOffset + 3] -ne 0x00) {
                  throw "NSIS uninstaller is missing its PE header: $Path"
              }

              $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
              if ($machine -ne 0x014c) {
                  throw ("NSIS uninstaller has unexpected PE machine 0x{0:X4}: {1}" -f $machine, $Path)
              }
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash
              Write-Host ("NSIS uninstaller PE validated: bytes={0}; machine=0x{1:X4}; sha256={2}" -f `
                  $bytes.Length, $machine, $hash)
          }

          $packageDir = Join-Path $env:RUNNER_TEMP "windows-package"
          $archives = @(Get-ChildItem -Path $packageDir -Filter "*-portable.zip" -File)
          if ($archives.Count -ne 1) {
              throw "Expected exactly one portable archive, found $($archives.Count)"
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "windows-portable"
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          Expand-Archive -Path $archives[0].FullName -DestinationPath $extractDir

          $portableCli = Join-Path $extractDir "openai-reasoning-guard-cli.exe"
          $qsqlite = Join-Path $extractDir "plugins/sqldrivers/qsqlite.dll"
          if (-not (Test-Path $portableCli -PathType Leaf)) {
              throw "CLI executable is missing from portable archive: $portableCli"
          }
          if (-not (Test-Path $qsqlite -PathType Leaf)) {
              throw "QSQLITE plugin is missing from portable archive: $qsqlite"
          }
          Invoke-ProfileSmoke -Cli $portableCli -Name "portable-${{ matrix.arch }}"

          $installers = @(Get-ChildItem -Path $packageDir -Filter "*-installer.exe" -File)
          if ($installers.Count -ne 1) {
              throw "Expected exactly one installer, found $($installers.Count)"
          }
          $installDir = Join-Path $env:RUNNER_TEMP "windows-installer-${{ matrix.arch }}"
          if ($installDir -match '\s') {
              throw "NSIS silent installation path must not contain whitespace: $installDir"
          }
          $startMenuDir = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::Programs)) `
              "OpenAI Reasoning Guard"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $startMenuDir -ErrorAction SilentlyContinue
          $installResult = Start-Process -FilePath $installers[0].FullName `
              -ArgumentList @("/S", "/D=$installDir") -PassThru -Wait
          if ($installResult.ExitCode -ne 0) {
              throw "NSIS installer failed with exit code $($installResult.ExitCode)"
          }

          $installedCli = Join-Path $installDir "openai-reasoning-guard-cli.exe"
          $installedQtSql = Join-Path $installDir "Qt5Sql.dll"
          $installedQsqlite = Join-Path $installDir "plugins/sqldrivers/qsqlite.dll"
          if (-not (Test-Path $installedCli -PathType Leaf)) {
              throw "CLI executable is missing after NSIS installation: $installedCli"
          }
          if (-not (Test-Path $installedQtSql -PathType Leaf)) {
              throw "Qt5Sql runtime is missing after NSIS installation: $installedQtSql"
          }
          if (-not (Test-Path $installedQsqlite -PathType Leaf)) {
              throw "QSQLITE plugin is missing after NSIS installation: $installedQsqlite"
          }
          $guiShortcut = Join-Path $startMenuDir "OpenAI Reasoning Guard.lnk"
          $cliShortcut = Join-Path $startMenuDir "CLI.lnk"
          if (-not (Test-Path $guiShortcut -PathType Leaf) -or -not (Test-Path $cliShortcut -PathType Leaf)) {
              throw "NSIS installer did not create the expected Start Menu shortcuts"
          }
          Invoke-ProfileSmoke -Cli $installedCli -Name "installer-${{ matrix.arch }}"

          $sentinelDir = Join-Path $installDir "uninstall-sentinel"
          $sentinel = Join-Path $sentinelDir "keep-me.txt"
          New-Item -ItemType Directory -Force -Path $sentinelDir | Out-Null
          Set-Content -LiteralPath $sentinel -Value "uninstall cleanup sentinel"

          $uninstaller = Join-Path $installDir "Uninstall.exe"
          if (-not (Test-Path $uninstaller -PathType Leaf)) {
              throw "NSIS uninstaller is missing after installation: $uninstaller"
          }
          Assert-NsisUninstallerPe -Path $uninstaller
          $uninstallerDiagnostic = Join-Path $env:RUNNER_TEMP "windows-uninstaller-${{ matrix.arch }}-diagnostic.exe"
          Copy-Item -LiteralPath $uninstaller -Destination $uninstallerDiagnostic -Force
          $uninstallTimer = [System.Diagnostics.Stopwatch]::StartNew()
          Push-Location $env:RUNNER_TEMP
          try {
              & $uninstaller /S
              $uninstallExitCode = $LASTEXITCODE
          }
          finally {
              Pop-Location
          }
          if ($uninstallExitCode -ne 0) {
              throw "NSIS uninstaller failed with exit code $uninstallExitCode"
          }
          $uninstallDeadline = [DateTime]::UtcNow.AddSeconds(10)
          while ((Test-Path -LiteralPath $installDir) -and [DateTime]::UtcNow -lt $uninstallDeadline) {
              Start-Sleep -Milliseconds 100
          }
          $uninstallTimer.Stop()
          if (Test-Path -LiteralPath $installDir) {
              $remaining = Get-ChildItem -LiteralPath $installDir -Force -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -First 20 -ExpandProperty FullName
              throw "NSIS uninstaller left the custom installation directory behind: $installDir; remaining: $($remaining -join ', ')"
          }
          if (Test-Path -LiteralPath $sentinel) {
              throw "NSIS uninstaller left a non-payload sentinel behind: $sentinel"
          }
          if (Test-Path -LiteralPath $startMenuDir) {
              throw "NSIS uninstaller left the Start Menu directory behind: $startMenuDir"
          }
          Write-Host "Confirmed NSIS removed the custom installation directory, sentinel, and Start Menu shortcuts in $($uninstallTimer.ElapsedMilliseconds) ms: $installDir"

      - name: Upload failed NSIS uninstaller diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openai-reasoning-guard-windows-${{ matrix.arch }}-uninstaller-diagnostic
          path: ${{ runner.temp }}/windows-uninstaller-${{ matrix.arch }}-diagnostic.exe
          if-no-files-found: warn

  macos:
    name: macOS ${{ matrix.arch }} shell installer
    needs: plan
    if: needs.plan.outputs.macos_enabled == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.macos_matrix) }}
    env:
      QT_ARCHIVE_URL: ${{ secrets[matrix.qt_secret] }}
      QT_ARCHIVE_FALLBACK_URL: https://github.com/${{ github.repository }}/releases/download/${{ matrix.sdk_release_tag }}/${{ matrix.sdk_asset }}
      DOWNLOAD_PROXY: ${{ secrets.DOWNLOAD_PROXY }}
      CLEAN_PACKAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.clean != 'false' }}
      BUILD_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CODESIGN_IDENTITY_SECRET: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID_SECRET: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID_SECRET: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD_SECRET: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_PROFILE_SECRET: ${{ secrets.MACOS_NOTARY_PROFILE }}
    steps:
      - name: Checkout
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('macos-{0}', matrix.arch)
        uses: actions/checkout@v4

      - name: Resolve Qt SDK
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('macos-{0}', matrix.arch)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${QT_ARCHIVE_URL:-}" && -z "${QT_ARCHIVE_FALLBACK_URL:-}" ]]; then
            echo "Missing repository secret ${{ matrix.qt_secret }} and no fallback Qt SDK URL is configured" >&2
            exit 2
          fi
          qt_dir="${RUNNER_TEMP}/qt-sdk"
          archive="${RUNNER_TEMP}/qt-sdk.archive"
          mkdir -p "${qt_dir}"
          qt_urls=()
          if [[ -n "${QT_ARCHIVE_URL:-}" ]]; then
            qt_urls+=("${QT_ARCHIVE_URL}")
          fi
          if [[ -n "${QT_ARCHIVE_FALLBACK_URL:-}" && "${QT_ARCHIVE_FALLBACK_URL:-}" != "${QT_ARCHIVE_URL:-}" ]]; then
            qt_urls+=("${QT_ARCHIVE_FALLBACK_URL}")
          fi
          downloaded=0
          for qt_url in "${qt_urls[@]}"; do
            curl_args=(-L --fail --connect-timeout 30 -o "${archive}")
            if [[ -n "${DOWNLOAD_PROXY:-}" ]]; then
              curl_args+=(--proxy "${DOWNLOAD_PROXY}")
            fi
            if curl "${curl_args[@]}" "${qt_url}"; then
              downloaded=1
              break
            fi
            echo "warning: failed to download Qt SDK from ${qt_url}; trying next candidate" >&2
          done
          if ((downloaded == 0)); then
            echo "Unable to download Qt SDK archive" >&2
            exit 2
          fi
          if tar -tf "${archive}" >/dev/null 2>&1; then
            tar -xf "${archive}" -C "${qt_dir}"
          elif unzip -tq "${archive}" >/dev/null 2>&1; then
            unzip -q "${archive}" -d "${qt_dir}"
          else
            echo "Qt archive must be a tar/tar.gz/tar.xz/tgz or zip file" >&2
            exit 2
          fi
          moc_path="$(find "${qt_dir}" -type f -path '*/bin/moc' -print -quit)"
          if [[ -z "${moc_path}" ]]; then
            echo "Unable to locate bin/moc inside downloaded Qt archive" >&2
            exit 2
          fi
          qt_root="$(cd -- "$(dirname -- "${moc_path}")/.." && pwd)"
          test -x "${qt_root}/bin/macdeployqt"
          test -e "${qt_root}/lib/QtSql.framework/QtSql"
          test -f "${qt_root}/plugins/sqldrivers/libqsqlite.dylib"
          test -f "${qt_root}/lib/cmake/Qt5Sql/Qt5SqlConfig.cmake"
          echo "QT_ROOT=${qt_root}" >> "${GITHUB_ENV}"
          echo "Using Qt root: ${qt_root}"

      - name: Configure macOS signing
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('macos-{0}', matrix.arch)
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ]]; then
            {
              echo "MACOS_CODESIGN=1"
              echo "MACOS_CODESIGN_IDENTITY=-"
              echo "MACOS_CODESIGN_TIMESTAMP=none"
              echo "MACOS_CODESIGN_OPTIONS="
              echo "MACOS_NOTARIZE=0"
            } >> "${GITHUB_ENV}"
            echo "Using ad-hoc macOS signing; Developer ID certificate secret is not configured."
            exit 0
          fi

          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          if ! printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate_path}" 2>/dev/null; then
            printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 -D > "${certificate_path}"
          fi

          keychain_path="${RUNNER_TEMP}/macos-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD:-}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "${keychain_path}" $(security list-keychains -d user | sed 's/[ "]*//g')
          security default-keychain -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"

          identity="${MACOS_CODESIGN_IDENTITY_SECRET:-Developer ID Application}"
          {
            echo "MACOS_CODESIGN=1"
            echo "MACOS_CODESIGN_IDENTITY=${identity}"
            echo "MACOS_CODESIGN_TIMESTAMP="
            echo "MACOS_CODESIGN_OPTIONS=runtime"
          } >> "${GITHUB_ENV}"

          if [[ -n "${MACOS_NOTARY_PROFILE_SECRET:-}" ]]; then
            if [[ -z "${MACOS_NOTARY_APPLE_ID_SECRET:-}" || -z "${MACOS_NOTARY_TEAM_ID_SECRET:-}" || -z "${MACOS_NOTARY_PASSWORD_SECRET:-}" ]]; then
              echo "MACOS_NOTARY_PROFILE requires Apple ID, team ID, and app-specific password secrets so CI can create the ephemeral keychain profile" >&2
              exit 2
            fi
            xcrun notarytool store-credentials "${MACOS_NOTARY_PROFILE_SECRET}" \
              --apple-id "${MACOS_NOTARY_APPLE_ID_SECRET}" \
              --team-id "${MACOS_NOTARY_TEAM_ID_SECRET}" \
              --password "${MACOS_NOTARY_PASSWORD_SECRET}" \
              --keychain "${keychain_path}"
            {
              echo "MACOS_NOTARIZE=1"
              echo "MACOS_NOTARY_PROFILE=${MACOS_NOTARY_PROFILE_SECRET}"
              echo "MACOS_NOTARY_KEYCHAIN=${keychain_path}"
            } >> "${GITHUB_ENV}"
          elif [[ -n "${MACOS_NOTARY_APPLE_ID_SECRET:-}" && -n "${MACOS_NOTARY_TEAM_ID_SECRET:-}" && -n "${MACOS_NOTARY_PASSWORD_SECRET:-}" ]]; then
            {
              echo "MACOS_NOTARIZE=1"
              echo "MACOS_NOTARY_APPLE_ID=${MACOS_NOTARY_APPLE_ID_SECRET}"
              echo "MACOS_NOTARY_TEAM_ID=${MACOS_NOTARY_TEAM_ID_SECRET}"
              echo "MACOS_NOTARY_PASSWORD=${MACOS_NOTARY_PASSWORD_SECRET}"
            } >> "${GITHUB_ENV}"
          else
            echo "MACOS_NOTARIZE=0" >> "${GITHUB_ENV}"
            echo "Developer ID signing is configured, but notarization secrets are missing."
          fi

      - name: Build and test
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('macos-{0}', matrix.arch)
        shell: bash
        run: |
          set -euo pipefail
          build_dir="build-ci-${{ matrix.arch }}"
          cmake -S . -B "${build_dir}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}" \
            -DNET_TUNNEL_QT_SDK_ROOT="${QT_ROOT}" \
            -DNET_TUNNEL_BUILD_TESTS=ON
          cmake --build "${build_dir}" -j"$(sysctl -n hw.ncpu)"
          ctest --test-dir "${build_dir}" --output-on-failure

      - name: Build macOS shell installer
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('macos-{0}', matrix.arch)
        shell: bash
        run: |
          set -euo pipefail
          clean_arg=()
          if [[ "${CLEAN_PACKAGES}" == "true" ]]; then
            clean_arg+=(--clean)
          fi
          work_dir="${RUNNER_TEMP}/package-macos-${{ matrix.arch }}"
          echo "MACOS_PACKAGE_WORK_DIR=${work_dir}" >> "${GITHUB_ENV}"
          QT_ROOT="${QT_ROOT}" \
          BUILD_DIR="${PWD}/build-ci-${{ matrix.arch }}" \
          WORK_DIR="${work_dir}" \
          scripts/package-macos.sh \
            --arch "${{ matrix.arch }}" \
            --skip-build \
            "${clean_arg[@]}"

      - name: Validate installed macOS package and QSQLITE
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('macos-{0}', matrix.arch)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(dist/*macos-${{ matrix.arch }}*-installer.sh)
          shopt -u nullglob
          if ((${#installers[@]} != 1)); then
            echo "Expected exactly one macOS installer, found ${#installers[@]}" >&2
            exit 2
          fi
          OPEN_AFTER_INSTALL=0 INSTALL_CLI_SYMLINK=1 "${installers[0]}"
          bundle="/Applications/OpenAI Reasoning Guard.app"
          cli="/usr/local/bin/openai-reasoning-guard-cli"
          test -x "${cli}"
          test -f "${bundle}/Contents/Resources/qt.conf"
          test -f "${bundle}/Contents/Frameworks/QtSql.framework/QtSql"
          test -f "${bundle}/Contents/PlugIns/sqldrivers/libqsqlite.dylib"
          grep -F "Plugins = PlugIns" "${bundle}/Contents/Resources/qt.conf" >/dev/null
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/profile-smoke.XXXXXX")"
          printf '{}\n' > "${smoke_dir}/config.json"
          QT_DEBUG_PLUGINS=1 "${cli}" \
            --config "${smoke_dir}/config.json" profile list --json \
            >"${smoke_dir}/result.json" 2>"${smoke_dir}/plugins.log"
          grep -F "Contents/PlugIns/sqldrivers/libqsqlite.dylib" "${smoke_dir}/plugins.log" >/dev/null
          grep -F '"total_items": 0' "${smoke_dir}/result.json" >/dev/null
          test -s "${smoke_dir}/upstream-profiles.sqlite3"

      - name: Upload macOS shell installer
        if: env.BUILD_TARGET == 'all' || env.BUILD_TARGET == format('macos-{0}', matrix.arch)
        uses: actions/upload-artifact@v4
        with:
          name: openai-reasoning-guard-macos-${{ matrix.arch }}
          path: dist/*macos-${{ matrix.arch }}*-installer.sh
          if-no-files-found: error

  publish-release:
    name: Publish complete package set
    needs: [plan, linux, windows, windows-smoke, macos]
    if: github.event_name == 'push' || inputs.publish_release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openai-reasoning-guard-*
          path: release-assets
          merge-multiple: true

      - name: Validate complete package set
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^project([^ ]* VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          version="${version:-0.1.0}"
          expected="${RUNNER_TEMP}/expected-release-assets.txt"
          actual="${RUNNER_TEMP}/actual-release-assets.txt"

          {
            for arch in amd64 i386 arm64 armhf; do
              printf 'openai-reasoning-guard_%s_%s.deb\n' "${version}" "${arch}"
            done
            for arch in x86_64 i686 aarch64 armv7hl; do
              printf 'openai-reasoning-guard-%s-1.%s.rpm\n' "${version}" "${arch}"
            done
            for variant in cli gui; do
              for arch in x86_64 i686 aarch64 armhf; do
                printf 'openai-reasoning-guard-%s-%s-%s.AppImage\n' "${variant}" "${version}" "${arch}"
              done
            done
            for arch in x86_64 x86_32 arm64; do
              printf 'openai-reasoning-guard-windows-%s-%s-installer.exe\n' "${arch}" "${version}"
              printf 'openai-reasoning-guard-windows-%s-%s-portable.zip\n' "${arch}" "${version}"
            done
            for arch in x86_64 aarch64; do
              printf 'openai-reasoning-guard-macos-%s-%s-installer.sh\n' "${arch}" "${version}"
            done
          } | LC_ALL=C sort > "${expected}"

          find release-assets -type f -printf '%f\n' | LC_ALL=C sort > "${actual}"
          test "$(wc -l < "${expected}")" -eq 24
          test "$(wc -l < "${actual}")" -eq 24
          diff -u "${expected}" "${actual}"

          while IFS= read -r asset; do
            path="$(find release-assets -type f -name "${asset}" -print -quit)"
            test -n "${path}"
            test -s "${path}"
          done < "${expected}"

          echo "EXPECTED_ASSETS_FILE=${expected}" >> "${GITHUB_ENV}"

      - name: Verify release tag source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          source_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${source_commit}" ]]; then
            echo "Release tag ${RELEASE_TAG} points to ${tag_commit}, expected ${source_commit}" >&2
            exit 2
          fi
          echo "RELEASE_SOURCE_COMMIT=${source_commit}" >> "${GITHUB_ENV}"

      - name: Publish and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            create_args=(
              "${RELEASE_TAG}"
              --repo "${GITHUB_REPOSITORY}"
              --verify-tag
              --title "${RELEASE_TAG}"
              --notes "OpenAI Reasoning Guard package build ${RELEASE_SOURCE_COMMIT}."
            )
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

          mapfile -t files < <(find release-assets -type f -print | LC_ALL=C sort)
          test "${#files[@]}" -eq 24
          gh release upload "${RELEASE_TAG}" "${files[@]}" \
            -R "${GITHUB_REPOSITORY}" --clobber

          declare -A expected_assets=()
          while IFS= read -r asset; do
            expected_assets["${asset}"]=1
          done < "${EXPECTED_ASSETS_FILE}"
          while IFS= read -r asset; do
            if [[ -z "${expected_assets[${asset}]+present}" ]]; then
              gh release delete-asset "${RELEASE_TAG}" "${asset}" \
                -R "${GITHUB_REPOSITORY}" -y
            fi
          done < <(gh release view "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name')

          remote_assets="${RUNNER_TEMP}/remote-release-assets.tsv"
          remote_names="${RUNNER_TEMP}/remote-release-assets.txt"
          gh release view "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[] | [.name, (.size | tostring)] | @tsv' \
            > "${remote_assets}"
          cut -f1 "${remote_assets}" | LC_ALL=C sort > "${remote_names}"
          test "$(wc -l < "${remote_names}")" -eq 24
          diff -u "${EXPECTED_ASSETS_FILE}" "${remote_names}"
          if awk -F '\t' '$2 <= 0 { found=1 } END { exit !found }' "${remote_assets}"; then
            echo "Release contains an empty asset" >&2
            exit 2
          fi

          git fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "${tag_commit}" != "${RELEASE_SOURCE_COMMIT}" ]]; then
            echo "Release tag moved to ${tag_commit} during publication; expected ${RELEASE_SOURCE_COMMIT}" >&2
            exit 2
          fi
